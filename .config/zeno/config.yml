snippets:
  # 例: mkdir hoge CD<space>
  # 末尾テキストをディレクトリ名として移動する
  - name: cd there
    keyword: CD
    snippet: "&& cd $_"
    context:
      lbuffer: '.+\s'

  # 例: cat hoge.md CC<space>
  # 出力結果をクリップボードにコピーする
  - name: copy
    keyword: CC
    snippet: "| pbcopy"
    context:
      lbuffer: '.+\s'

  # 例: ls G<space> md
  # grepするパイプの追加
  - name: grep
    keyword: G
    snippet: "| grep"
    context:
      lbuffer: '.+\s'

  # 例: ./hoge.sh NULL<space>
  # 成功出力だけするやつ
  - name: "null"
    keyword: "null"
    snippet: ">/dev/null 2>&1"
    # auto expand 条件
    # 未定義なら行頭でのみ有効
    context:
      # buffer: ''
      lbuffer: '.+\s'
      # rbuffer: ''

  # コマンド省略
  - name: nvim current directory
    keyword: nv
    snippet: "nvim ."

  - name: claude code
    keyword: cc
    snippet: "claude"

  - name: my ip address
    keyword: myip
    snippet: "curl ifconfig.me"

  - name: today
    keyword: td
    snippet: date +%Y-%m-%d
